spring:
  application:
    name: tech-challenge-os-service
  datasource:
    url: jdbc:postgresql://localhost:5432/os_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/os_service_history
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

server:
  port: 8081
  servlet:
    context-path: /api/v1

app:
  rabbitmq:
    exchange: os.exchange
    queue: os.events.queue
    routing-key: os.event
  outbox:
    delay-ms: ${OUTBOX_DELAY_MS:1000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true
