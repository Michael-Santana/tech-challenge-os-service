name: OS CI/CD

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: Build, testes e qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, testes e cobertura
        run: sh ./mvnw -B clean verify
      - name: SonarQube quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" && test -n "$SONAR_HOST_URL" && test -n "$SONAR_PROJECT_KEY" || { echo "::error::Configure SONAR_TOKEN, SONAR_HOST_URL e SONAR_PROJECT_KEY; PRs de forks nao recebem secrets."; exit 1; }
          args=("-Dsonar.projectKey=$SONAR_PROJECT_KEY" "-Dsonar.qualitygate.wait=true")
          if [ -n "$SONAR_ORGANIZATION" ]; then args+=("-Dsonar.organization=$SONAR_ORGANIZATION"); fi
          sh ./mvnw -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar "${args[@]}"
      - name: Publicar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-test-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: warn

  deploy:
    name: Publicar imagem e implantar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: os-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagem imutavel
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker build -f docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.30.0
      - name: Configurar acesso Kubernetes
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo "::error::Configure KUBE_CONFIG no environment production"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info
      - name: Implantar e verificar rollout
        run: |
          kubectl apply -f k8s/namespace.yaml -f k8s/configmap.yaml -f k8s/service.yaml
          kubectl get secret ghcr-pull -n os-service > /dev/null
          kubectl set image --local -f k8s/deployment.yaml os-service-app="$IMAGE" -o yaml | kubectl apply -f -
          kubectl rollout status deployment/os-service-app -n os-service --timeout=10m
